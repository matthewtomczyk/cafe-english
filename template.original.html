<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>Interactive English Template</title><link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Patrick+Hand&display=swap"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
  :root{
    --paper:#FFFFFF;
    --panel:#F8F5F0;
    --bubble:#F4EFE6;
    --ink:#211B14;
    --ink-soft:#5C4D3C;
    --ink-faint:#968574;
    --line:#E8E0D5;
    --line-strong:#D6C9B8;
--red: #7C5421;
--red-fill: #5E4017;
--red-mid: #8F6227;
--red-soft: #5E40170f;
--red-soft2: #5E40171a;
    --yellow:#F0C929;
    --good:#2C7A4B;
    --good-bg:#2C7A4B1a;
    --bad:#B3661A;
    --bad-bg:#B3661A1a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1A1612;
      --panel:#241E18;
      --bubble:#2B231C;
      --ink:#F3EDE4;
      --ink-soft:#C8BAAA;
      --ink-faint:#8F8071;
      --line:#3D3328;
      --line-strong:#524536;
--red: #D4A373;
--red-fill: #4A3312;
--red-mid: #E0B486;
--red-soft: #D4A37314;
--red-soft2: #D4A37326;
      --yellow:#F0C929;
      --good:#5FCB8C;
      --good-bg:#5FCB8C1f;
      --bad:#E0995A;
      --bad-bg:#E0995A1f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1A1612;
    --panel:#241E18;
    --bubble:#2B231C;
    --ink:#F3EDE4;
    --ink-soft:#C8BAAA;
    --ink-faint:#8F8071;
    --line:#3D3328;
    --line-strong:#524536;
--red: #D4A373;
--red-fill: #4A3312;
--red-mid: #E0B486;
--red-soft: #D4A37314;
--red-soft2: #D4A37326;
    --yellow:#F0C929;
    --good:#5FCB8C;
    --good-bg:#5FCB8C1f;
    --bad:#E0995A;
    --bad-bg:#E0995A1f;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter", sans-serif;
    font-size:16px;
    line-height:1.55;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:0 20px; }
  h1,h2,h3{ font-family:"Poppins", sans-serif; text-wrap:balance; }
  a{ color:var(--red-mid); }
  .kicker{
    font-family:"Inter", sans-serif;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    opacity:.75;
    margin:0 0 4px;
  }

  /* Top masthead */
  .top-masthead{ background:var(--red-fill); color:#fff; padding:34px 20px 32px; }
  .top-masthead-inner{ max-width:920px; margin:0 auto; }
  .top-masthead h1{ margin:0; font-size:clamp(1.6rem,4.5vw,2.2rem); font-weight:700; }
  .top-masthead .progress-note{ margin:10px 0 0; font-size:.88rem; opacity:.85; }

  /* Contents */
  .contents{ margin:36px 0 44px; }
  .contents-title{ margin:0 0 16px; font-size:1.1rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .contents-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .contents-card{
    display:flex; gap:12px; align-items:flex-start;
    padding:13px 15px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    text-decoration:none;
    color:inherit;
  }
  .contents-card:hover{ border-color:var(--red-mid); }
  .contents-num{
    flex:0 0 auto; width:28px; height:28px;
    background:var(--yellow); color:#26260a;
    font-family:"Poppins",sans-serif; font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
  }
  .contents-text{ font-family:"Poppins",sans-serif; color:var(--ink); font-size:.92rem; font-weight:600; line-height:1.35; }

  /* Topic pager */
  .topic-pager{ display:flex; align-items:center; justify-content:center; gap:10px; margin:52px 0 22px; flex-wrap:wrap; }
  .topic-pager a{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:20px;
    border:1.5px solid var(--line-strong);
    font-family:"Poppins",sans-serif; font-weight:600; font-size:.82rem;
    color:var(--ink-soft); text-decoration:none;
  }
  .topic-pager a:hover{ border-color:var(--red-mid); color:var(--red-mid); }
  .topic-pager .count{ font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--ink-faint); }

  /* Topic hero (full-bleed) */
  .unit-hero{ background:var(--red-fill); color:#fff; padding:28px 0 26px; margin:0; }
  .unit-hero-inner{ max-width:920px; margin:0 auto; padding:0 20px; display:flex; align-items:center; gap:18px; }
  .unit-badge{
    flex:0 0 auto; width:52px; height:52px;
    background:var(--yellow); color:#26260a;
    font-family:"Poppins", sans-serif; font-weight:700; font-size:24px;
    display:flex; align-items:center; justify-content:center;
    border-radius:8px;
  }
  .unit-hero h1{ margin:0; font-size:clamp(1.5rem,4.5vw,2.1rem); font-weight:700; }
  .unit-hero .kicker{ opacity:.75; }

  .lede{ font-size:1.02rem; color:var(--ink-soft); }
  .lede strong{ color:var(--ink); font-weight:600; }

  .term-list{ list-style:none; margin:18px 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .term-list li{
    background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--red-mid);
    border-radius:6px; padding:10px 14px;
  }

  .notes-box{
    margin-top:18px; padding:14px 18px;
    background:var(--red-soft); border:1px solid var(--red-soft2);
    border-radius:8px; font-size:.93rem; color:var(--ink-soft);
  }
  .notes-box b{ color:var(--ink); }
  .notes-box div + div{ margin-top:6px; }

  .mistake-pair{ display:flex; flex-wrap:wrap; gap:20px; margin:16px 0; }
  .mistake-col{ flex:1 1 260px; }
  .mistake-col h5{ margin:0 0 8px; font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-family:"Poppins",sans-serif; }
  .mistake-col div{ margin-bottom:6px; font-size:.94rem; }
  .mistake-col.wrong div::before{ content:"\2717  "; color:var(--bad); font-weight:700; }
  .mistake-col.right div::before{ content:"\2713  "; color:var(--good); font-weight:700; }

  /* Speech bubbles */
  .bubble-field{ display:flex; flex-wrap:wrap; gap:16px; margin:18px 0 6px; }
  .bubble{
    background:var(--bubble); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; flex:1 1 260px; max-width:420px;
    font-family:"Patrick Hand", cursive; font-size:1.15rem; line-height:1.35;
    color:var(--ink); position:relative;
  }
  .bubble b{ color:var(--red-mid); }
  .bubble::after{
    content:""; position:absolute; width:16px; height:16px; background:var(--bubble);
    border-left:1px solid var(--line); border-bottom:1px solid var(--line);
    bottom:-8px; left:28px; transform:rotate(-45deg);
  }
  .bubble:nth-child(even)::after{ left:auto; right:28px; }
  .bubble.exercise-bubble{ font-family:"Inter",sans-serif; font-size:.98rem; line-height:1.65; max-width:460px; }
  .bubble.exercise-bubble .blank{ margin:0 2px; }

  /* Meme / illustration placeholder */
  .meme-placeholder{
    margin:18px 0; padding:22px;
    border:1.5px dashed var(--line-strong);
    border-radius:10px;
    background:var(--panel);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    text-align:center;
  }
  .meme-placeholder .icon{ font-size:1.6rem; }
  .meme-placeholder .caption{ font-size:.86rem; color:var(--ink-faint); font-style:italic; max-width:480px; }

  /* Original illustrations (plain – no bubble) */
  .illustration-card{
    margin:24px 0;
  }
  .illustration-card svg{ width:100%; height:auto; display:block; color:var(--ink-soft); }
  .illustration-card img{ width:100%; height:auto; display:block; border-radius:6px; }
  .illustration-card figcaption{ margin-top:10px; font-size:.82rem; color:var(--ink-faint); font-style:italic; text-align:center; }

  /* Reading text (plain – no bubble) */
  .reading-card{
    margin:28px 0;
  }
  .reading-card h4{
    margin:0 0 14px; font-family:"Poppins",sans-serif;
    font-size:1.18rem; color:var(--red-fill); font-weight:700;
    padding-bottom:7px; border-bottom:2px solid var(--red-mid);
  }
  .reading-card .reading-text{
    font-size:1.02rem; line-height:1.8; color:var(--ink);
  }
  .reading-card .reading-text strong{
    color:var(--red-mid); font-weight:700;
  }

  /* Vocabulary bubble (definitions & word lists) */
  .def-box{
    margin:22px 0; padding:16px 20px;
    background:var(--bubble);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .def-box > p:first-child{ margin-top:0; }
  .def-box > p:last-child{ margin-bottom:0; }
  .def-box strong{ color:var(--red-mid); }

  /* "Over to you" reflection box */
  .over-to-you{
    margin:46px 0 8px;
    background:var(--red-fill);
    color:#fff;
    border-radius:12px;
    padding:26px 26px 24px;
  }
  .over-to-you-head{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .over-to-you h3{ margin:0; font-size:1.2rem; font-style:italic; }
  .over-to-you p{ margin:0 0 14px; opacity:.92; }
  .over-to-you a{ color:var(--yellow); text-decoration:underline; }
  .over-to-you-video{
    position:relative; width:100%; aspect-ratio:16/9;
    margin:0 0 18px; overflow:hidden; border-radius:10px;
  }
  .over-to-you-video iframe{
    position:absolute; top:0; left:0; width:100%; height:100%;
    border:0; border-radius:10px;
  }
  .over-to-you textarea{
    width:100%;
    min-height:90px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08);
    color:#fff;
    font-family:"Inter",sans-serif;
    font-size:.95rem;
    padding:12px;
    resize:vertical;
  }
  .over-to-you textarea::placeholder{ color:rgba(255,255,255,.55); }
  .over-to-you textarea:focus{ outline:2px solid var(--yellow); outline-offset:1px; }
  .over-to-you .save-note{ font-size:.78rem; opacity:.7; margin-top:8px; transition:opacity .25s; }
  .over-to-you .save-note.flash{ opacity:1; color:var(--yellow); }

  /* Exercises */
  .exercise{ margin-top:28px; padding:22px 22px 20px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .exercise-num{
    display:inline-block; font-family:"Poppins",sans-serif; font-weight:700; color:#fff;
    background:var(--red-fill); font-size:.85rem; padding:3px 9px; border-radius:5px;
    margin-right:10px; vertical-align:middle;
  }
  .exercise h3{ margin:0 0 6px; font-size:1.1rem; display:flex; align-items:center; }
  .exercise .instructions{ color:var(--ink-soft); font-size:.94rem; margin:0 0 16px; }

  .cloze-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  .cloze-list li{ line-height:2.1; }
  .cloze-list .qnum{ font-family:"IBM Plex Mono",monospace; color:var(--ink-faint); font-size:.85rem; margin-right:4px; }

  /* Image cloze: one answer field under each picture */
  .image-cloze-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:0; }
  .image-cloze-card{
    margin:0; padding:12px;
    background:var(--paper); border:1px solid var(--line); border-radius:8px;
  }
  .image-cloze-card img{
    display:block; width:100%; aspect-ratio:3/2; object-fit:contain;
    background:var(--panel); border-radius:6px;
  }
  .image-cloze-card figcaption{ margin-top:10px; }
  .image-cloze-card .blank{ display:block; width:100%; min-width:0; margin:0; text-align:center; }
  .blank{
    font-family:"Inter",sans-serif; font-size:.96rem; padding:4px 7px;
    border:1.5px solid var(--line-strong); border-radius:5px;
    background:var(--paper); color:var(--ink); min-width:90px; margin:0 2px;
  }
  .blank:focus{ outline:2px solid var(--red-mid); outline-offset:1px; }
  .blank.correct{ border-color:var(--good); background:var(--good-bg); }
  .blank.incorrect{ border-color:var(--bad); background:var(--bad-bg); }

  .exercise-controls{ margin-top:18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  button.btn{
    font-family:"Poppins",sans-serif; font-weight:600; font-size:.88rem; padding:9px 18px;
    border-radius:6px; border:1.5px solid var(--red-fill); background:var(--red-fill); color:#fff; cursor:pointer;
  }
  button.btn.secondary{ background:transparent; color:var(--red-mid); border-color:var(--line-strong); }
  button.btn:hover{ filter:brightness(1.08); }
  .score{ font-family:"IBM Plex Mono",monospace; font-size:.88rem; color:var(--ink-soft); }
  .score.done{ color:var(--good); font-weight:600; }

  /* Matching */
  .match-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:560px){ .match-grid{ grid-template-columns:1fr; } }
  .match-col h4{ margin:0 0 10px; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); }
  .match-item{
    padding:10px 12px; margin-bottom:8px; background:var(--paper);
    border:1.5px solid var(--line-strong); border-radius:6px; font-size:.94rem; cursor:pointer; user-select:none;
  }
  .match-item.selected{ border-color:var(--red-mid); box-shadow:0 0 0 2px var(--red-soft2); }
  .match-item.matched{ border-color:var(--good); background:var(--good-bg); cursor:default; }
  .match-item.wrong{ border-color:var(--bad); background:var(--bad-bg); }
  .match-item .tag{ display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--ink-faint); margin-right:8px; }

  /* Word bank + chips */
  .word-bank{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; min-height:14px; }
  .word-chip{
    font-family:"IBM Plex Mono",monospace; font-size:.85rem; padding:5px 11px; border-radius:14px;
    background:var(--red-soft2); color:var(--red-mid); border:1px solid var(--red-soft2);
  }
  .word-chip.selectable{ cursor:pointer; user-select:none; }
  .word-chip.chip-selected{ outline:2px solid var(--red-mid); outline-offset:1px; }
  .word-chip.chip-correct{ background:var(--good-bg); color:var(--good); border-color:var(--good); }
  .word-chip.chip-incorrect{ background:var(--bad-bg); color:var(--bad); border-color:var(--bad); }

  /* Choice exercise */
  .choice-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .choice-list li{ line-height:2.2; }
  .choice-list .qnum{ font-family:"IBM Plex Mono",monospace; color:var(--ink-faint); font-size:.85rem; margin-right:4px; }
  .choice-pill{
    display:inline-block; padding:5px 13px; border-radius:16px; border:1.5px solid var(--line-strong);
    font-family:"IBM Plex Mono",monospace; font-size:.85rem; cursor:pointer; color:var(--ink-soft);
    background:var(--paper); user-select:none; margin:0 3px; max-width:100%;
  }
  .choice-inline{ display:inline; }
  .choice-pill.selected{ border-color:var(--red-mid); color:var(--red-mid); background:var(--red-soft2); }
  .choice-pill.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .choice-pill.incorrect{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }

  /* Reference table */
  .ref-table{ width:100%; border-collapse:collapse; margin:18px 0; font-size:.94rem; }
  .ref-table th, .ref-table td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
  .ref-table th{ font-family:"Poppins",sans-serif; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); }

  /* Closing note */
  .closing-note{
    margin:52px 0 0; background:var(--red-fill); color:#fff; border-radius:12px; padding:26px 26px 24px; text-align:center;
  }
  .closing-note h3{ margin:0 0 8px; font-size:1.3rem; font-style:italic; }
  .closing-note p{ margin:0; opacity:.9; }

  footer{ max-width:920px; margin:40px auto 0; padding:20px 0 80px; border-top:1px solid var(--line); font-size:.8rem; color:var(--ink-faint); }
</style>

<div class="top-masthead">
  <div class="top-masthead-inner">
    <p class="kicker">Interactive Textbook Template</p>
    <h1>Interactive English Template</h1>
  </div>
</div>

<div class="wrap">
  <div class="contents" id="top">
    <h2 class="contents-title">Contents</h2>
    <div class="contents-grid" id="contents-grid"></div>
  </div>
</div>

<div id="topics-root"></div>

<div class="wrap">
  <div class="closing-note">
    <p>Replace this closing note with your own attribution, licence, or publishing information.</p>
  </div>
</div>

<script>

function normalize(s){
  return (s||"").toLowerCase().trim().replace(/[.,!?]/g,"").replace(/\s+/g," ").replace(/-/g," ");
}
function altSet(answers){ return answers.map(normalize); }

/* ---------- Generic cloze (token-based, supports multiple blanks per line) ---------- */
function buildTokenCloze(exId, containerId, lines){
  const container = document.getElementById(containerId);
  lines.forEach(line=>{
    const li = document.createElement('li');
    li.innerHTML = line.replace(/\{(\d+)(?:\|(given):([^}]*))?\}/g, (m, idx, g, val)=>{
      if(g==='given') return '<input class="blank correct" type="text" data-idx="'+idx+'" value="'+val+'" disabled>';
      return '<input class="blank" type="text" data-idx="'+idx+'" autocomplete="off">';
    });
    container.appendChild(li);
  });
}
function buildImageCloze(exId, containerId, images){
  const container = document.getElementById(containerId);
  images.forEach((image,index)=>{
    const card = document.createElement('figure');
    card.className = 'image-cloze-card';

    const img = document.createElement('img');
    img.src = image.src;
    img.alt = image.alt || 'Organic matter used as an energy source';
    img.loading = 'lazy';

    const caption = document.createElement('figcaption');
    const input = document.createElement('input');
    input.className = 'blank';
    input.type = 'text';
    input.dataset.idx = index;
    input.autocomplete = 'off';
    input.setAttribute('aria-label', 'Description for picture '+(index+1));

    caption.appendChild(input);
    card.appendChild(img);
    card.appendChild(caption);
    container.appendChild(card);
  });
}
function checkExercise(exId){
  const inputs = document.querySelectorAll('#'+exId+' .blank:not([disabled])');
  let correct = 0;
  inputs.forEach(inp=>{
    const idx = +inp.dataset.idx;
    const ok = altSet(EX[exId][idx]).includes(normalize(inp.value));
    inp.classList.remove('correct','incorrect');
    inp.classList.add(ok?'correct':'incorrect');
    if(ok) correct++;
  });
  const scoreEl = document.getElementById(exId+'-score');
  scoreEl.textContent = correct+' / '+inputs.length+' correct';
  scoreEl.classList.toggle('done', correct===inputs.length);
}
function revealExercise(exId){
  const inputs = document.querySelectorAll('#'+exId+' .blank:not([disabled])');
  inputs.forEach(inp=>{
    const idx = +inp.dataset.idx;
    inp.value = EX[exId][idx][0];
    inp.classList.remove('correct','incorrect');
    inp.classList.add('correct');
  });
  document.getElementById(exId+'-score').textContent = 'Answers revealed';
}
function resetExercise(exId){
  const inputs = document.querySelectorAll('#'+exId+' .blank:not([disabled])');
  inputs.forEach(inp=>{ inp.value=''; inp.classList.remove('correct','incorrect'); });
  document.getElementById(exId+'-score').textContent = '';
}
function buildBank(exId, containerId, words){
  const bank = document.getElementById(containerId);
  words.forEach(w=>{
    const c = document.createElement('span');
    c.className='word-chip';
    c.textContent = w;
    bank.appendChild(c);
  });
}

/* ---------- Matching exercise (generic) ---------- */
const MATCH = {};
function renderMatch(exId, pairs){
  MATCH[exId] = { pairs, selected:null, matchedCount:0 };
  const leftCol = document.getElementById(exId+'-left');
  const rightCol = document.getElementById(exId+'-right');
  leftCol.innerHTML=''; rightCol.innerHTML='';
  const rightShuffled = pairs.map(p=>p.key).sort(()=>Math.random()-0.5);
  pairs.forEach((p,i)=>{
    const el = document.createElement('div');
    el.className='match-item'; el.dataset.id=i;
    el.innerHTML = '<span class="tag">'+(i+1)+'</span>'+p.desc;
    el.onclick = ()=>selectDesc(exId, i, el);
    leftCol.appendChild(el);
  });
  const letters = 'abcdefghij';
  rightShuffled.forEach((key,i)=>{
    const label = pairs.find(p=>p.key===key).label;
    const el = document.createElement('div');
    el.className='match-item'; el.dataset.key=key;
    el.innerHTML = '<span class="tag">'+letters[i]+'</span>'+label;
    el.onclick = ()=>selectTerm(exId, key, el);
    rightCol.appendChild(el);
  });
}
function selectDesc(exId, id, el){
  if(el.classList.contains('matched')) return;
  document.querySelectorAll('#'+exId+'-left .match-item').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  MATCH[exId].selected = id;
}
function selectTerm(exId, key, el){
  const state = MATCH[exId];
  if(el.classList.contains('matched') || state.selected===null) return;
  const pair = state.pairs[state.selected];
  const leftEl = document.querySelector('#'+exId+'-left .match-item[data-id="'+state.selected+'"]');
  if(pair.key===key){
    leftEl.classList.add('matched'); leftEl.classList.remove('selected');
    el.classList.add('matched');
    state.matchedCount++;
    document.getElementById(exId+'-score').textContent = state.matchedCount+' / '+state.pairs.length+' matched';
    document.getElementById(exId+'-score').classList.toggle('done', state.matchedCount===state.pairs.length);
  } else {
    el.classList.add('wrong');
    setTimeout(()=>{ el.classList.remove('wrong'); leftEl.classList.remove('selected'); },500);
  }
  state.selected = null;
}
function resetMatch(exId){
  document.getElementById(exId+'-score').textContent = '';
  renderMatch(exId, MATCH[exId].pairs);
}

/* ---------- Choice exercise (generic) ---------- */
const CHOICE = {};
/* A "..." (or "…") inside a sentence marks the gap the student has to fill. */
const CHOICE_BLANK = /(\.{3}|…)/;
function renderChoice(exId, qs){
  CHOICE[exId] = qs;
  const list = document.getElementById(exId+'-list');
  list.innerHTML='';
  qs.forEach((q,i)=>{
    const li = document.createElement('li');
    li.dataset.idx = i;
    let optsHtml = '';
    q.options.forEach(opt=>{ optsHtml += '<span class="choice-pill" data-opt="'+opt+'">'+opt+'</span>'; });
    /* If the sentence marks the gap with "...", the option chips go into the
       sentence itself; otherwise they are listed after it as before. */
    const blank = q.text.match(CHOICE_BLANK);
    let body;
    if(blank){
      const before = q.text.slice(0, blank.index);
      let after = q.text.slice(blank.index + blank[0].length);
      /* "your … ." → "your [chips]." – drop the space in front of punctuation */
      if(/^\s+[.,;:!?]/.test(after)) after = after.replace(/^\s+/, '');
      body = before + '<span class="choice-inline">' + optsHtml + '</span>' + after + (q.suffix ? ' ' + q.suffix : '');
    } else {
      body = q.text + ' ' + optsHtml + ' ' + q.suffix;
    }
    li.innerHTML = '<span class="qnum">'+(i+1)+'</span> '+body;
    li.querySelectorAll('.choice-pill').forEach(pill=>{
      pill.onclick = ()=>{
        li.querySelectorAll('.choice-pill').forEach(p=>p.classList.remove('selected','correct','incorrect'));
        pill.classList.add('selected');
      };
    });
    list.appendChild(li);
  });
}
function checkChoice(exId){
  const items = document.querySelectorAll('#'+exId+' .choice-list li');
  let correct = 0;
  items.forEach(li=>{
    const idx = +li.dataset.idx;
    const answer = CHOICE[exId][idx].answer;
    const selected = li.querySelector('.choice-pill.selected');
    li.querySelectorAll('.choice-pill').forEach(p=>p.classList.remove('correct','incorrect'));
    if(selected && selected.dataset.opt===answer){ selected.classList.add('correct'); correct++; }
    else if(selected){ selected.classList.add('incorrect'); }
  });
  const scoreEl = document.getElementById(exId+'-score');
  scoreEl.textContent = correct+' / '+items.length+' correct';
  scoreEl.classList.toggle('done', correct===items.length);
}
function revealChoice(exId){
  const items = document.querySelectorAll('#'+exId+' .choice-list li');
  items.forEach(li=>{
    const idx = +li.dataset.idx;
    const answer = CHOICE[exId][idx].answer;
    li.querySelectorAll('.choice-pill').forEach(p=>{
      p.classList.remove('selected','incorrect','correct');
      if(p.dataset.opt===answer) p.classList.add('correct');
    });
  });
  document.getElementById(exId+'-score').textContent = 'Answers revealed';
}
function resetChoice(exId){
  renderChoice(exId, CHOICE[exId]);
  document.getElementById(exId+'-score').textContent = '';
}

/* ---------- "Over to you" notes (persisted in this browser) ---------- */
const NOTES_PREFIX = 'res-over-to-you:';
function notesKey(id){ return NOTES_PREFIX + id; }
function overToYouHtml(b){
  return '<div class="over-to-you">' +
    '<div class="over-to-you-head"><h3>Over to you</h3></div>' +
    '<p>'+b.prompt+'</p>' +
    (b.video ? '<div class="over-to-you-video"><iframe loading="lazy" src="'+b.video.src+'" title="'+b.video.title+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>' : '') +
    '<textarea id="'+b.id+'" placeholder="Type your notes here&hellip;"></textarea>' +
    '<div class="save-note" data-note-for="'+b.id+'">Saved automatically in this browser only &mdash; not shared with anyone.</div>' +
    '</div>';
}
function initNotes(){
  document.querySelectorAll('.over-to-you textarea').forEach(ta=>{
    const key = notesKey(ta.id);
    const note = ta.parentElement.querySelector('.save-note');
    let saved = '';
    try{ saved = window.localStorage.getItem(key) || ''; }catch(e){}
    if(saved) ta.value = saved;

    let timer = null;
    ta.addEventListener('input', ()=>{
      try{ window.localStorage.setItem(key, ta.value); }catch(e){}
      if(note){
        note.textContent = 'Notes saved in this browser.';
        note.classList.add('flash');
        clearTimeout(timer);
        timer = setTimeout(()=>{
          note.textContent = 'Saved automatically in this browser only — not shared with anyone.';
          note.classList.remove('flash');
        }, 1800);
      }
    });
  });
}
